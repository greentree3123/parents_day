<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>나에게</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="me">
    <main class="phone-shell">
      <section class="sub-hero me-hero">
        <p class="eyebrow">2026 어버이날</p>
        <h1>나에게 남기는 말</h1>
        <p class="lead">부모님의 사랑으로 여기까지 온 나를 조용히 안아주는 페이지</p>
      </section>

      <section class="letter-card">
        <p class="dots">•••</p>
        <h2>서연에게</h2>
        <p>
          지금까지 잘 자라와줘서 고마워.<br>
          부모님이 주신 마음을 잊지 않고,<br>
          다정한 어른으로 살아가면 좋겠다.
        </p>
        <p>
          오늘의 이 페이지가 단순한 선물이 아니라<br>
          앞으로 더 자주 사랑을 표현하겠다는<br>
          작은 약속이 되기를.
        </p>
      </section>

      <section class="memory-strip">
        <h2>오늘의 나</h2>
        <label class="wide-upload">
          <input type="file" accept="image/*" data-page-photo="me">
          <img id="mePhoto" alt="나의 사진">
          <span>사진 넣기</span>
        </label>
      </section>

      <nav class="page-nav" aria-label="전용 페이지">
        <a href="index.html">부모님</a>
        <a href="sibling.html">동생</a>
        <a href="me.html" aria-current="page">나</a>
      </nav>
    </main>
    <script src="script.js"></script>
  </body>
</html>
