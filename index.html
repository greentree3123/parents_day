<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2026 어버이날</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="parents">
    <main class="phone-shell">
      <div class="music-control">
        <button class="sound-button" type="button" aria-label="음악 재생">♪</button>
        <label class="music-upload">
          <input type="file" accept="audio/*" id="musicInput">
          노래 넣기
        </label>
        <audio id="backgroundMusic" loop></audio>
      </div>

      <section class="hero">
        <div class="flower-field" aria-hidden="true">
          <span class="stem stem-one"><i></i></span>
          <span class="stem stem-two"><i></i></span>
          <span class="stem stem-three"><i></i></span>
          <span class="stem stem-four"><i></i></span>
          <span class="leaf leaf-left"></span>
          <span class="leaf leaf-right"></span>
        </div>
        <p class="eyebrow">2026 어버이날</p>
        <h1>사랑하는<br>엄마아빠께</h1>
        <p class="lead">미라와 재원이의 시간들,<br>그 속에서 부모님께 전하는 말</p>
        <span class="divider"></span>
      </section>

      <section class="section">
        <h2>시간을 거슬러</h2>
        <div class="timeline" id="timeline"></div>
      </section>

      <section class="section">
        <div class="section-title-row">
          <span></span>
          <h2>특별히 전하는 말</h2>
          <span></span>
        </div>
        <div class="message-grid">
          <button class="message-card mom" type="button" data-message="mom">
            <strong>🌹</strong>
            <span>엄마에게</span>
            <small>따로 전하고 싶은 말</small>
          </button>
          <button class="message-card dad" type="button" data-message="dad">
            <strong>🌿</strong>
            <span>아빠에게</span>
            <small>따로 전하고 싶은 말</small>
          </button>
        </div>
      </section>

      <section class="closing">
        <p class="dots">•••</p>
        <p class="eyebrow">마치며</p>
        <p class="closing-copy">
          부모님의 사랑으로 자란 저희가,<br>
          이제는 받은 사랑을 부모님께 다시<br>
          돌려드리며 효도할게요.<br><br>
          감사하고 사랑합니다.
        </p>
        <label class="portrait-upload">
          <input type="file" accept="image/*" data-final-photo>
          <img id="finalPhoto" alt="마지막에 들어갈 사진">
          <span>우리 사진 넣기</span>
        </label>
        <span class="mini-divider"></span>
        <p class="signature">부모님의 영원한 아기, 미라와 재원 올림</p>
        <p class="date">2026.05.08</p>
      </section>
    </main>

    <div class="modal" id="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" type="button" aria-label="닫기">×</button>
        <p class="modal-kicker" id="modalKicker"></p>
        <h3 id="modalTitle"></h3>
        <p id="modalBody"></p>
        <p class="photo-count" id="photoCount"></p>
        <div class="photo-grid" id="photoGrid"></div>
        <label class="add-photo" id="addPhotoLabel">
          <input type="file" accept="image/*" multiple id="photoInput">
          사진 여러 장 추가
          <small>한 번에 여러 장 선택할 수 있어요</small>
        </label>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
