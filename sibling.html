<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>동생에게</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-page="sibling">
    <main class="phone-shell">
      <section class="sub-hero sibling-hero">
        <p class="eyebrow">2026 어버이날</p>
        <h1>우리 가족의 막내에게</h1>
        <p class="lead">같은 사랑 안에서 자란 우리에게 남기는 작은 페이지</p>
      </section>

      <section class="letter-card">
        <p class="dots">•••</p>
        <h2>동생에게</h2>
        <p>
          엄마 아빠의 사랑을 함께 받아온 우리는<br>
          서로 다른 속도로 자라도 결국 같은 마음을<br>
          배워가고 있는 것 같아.
        </p>
        <p>
          오늘은 부모님께 마음을 전하는 날이지만,<br>
          너에게도 고맙다는 말을 남기고 싶었어.<br>
          우리 앞으로도 서로의 편이 되어주자.
        </p>
      </section>

      <section class="memory-strip">
        <h2>함께 남길 순간</h2>
        <label class="wide-upload">
          <input type="file" accept="image/*" data-page-photo="sibling">
          <img id="siblingPhoto" alt="동생과 함께한 사진">
          <span>사진 넣기</span>
        </label>
      </section>

      <nav class="page-nav" aria-label="전용 페이지">
